name: Scheduled Cycle Execution

on:
  schedule:
    # Daily at 06:00 IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-cycle:
    name: Run Edgedash Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Rule 51: Hard timeout of 10 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migration & cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python -m edgedash.storage --migrate 2>&1 | tee cycle.log
          python run_cycle.py 2>&1 | tee -a cycle.log

      - name: Upload cycle log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-log
          path: cycle.log
